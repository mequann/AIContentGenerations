name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m pipeline validate              # the contract must always validate
      - run: python -m pytest -q
      - name: offline end-to-end film (mock providers, draft size)
        run: RUN_SLOW=1 python -m pytest -q -k end_to_end
